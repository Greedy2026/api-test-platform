server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/testplatform;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  jwt:
    # 生产环境务必改为环境变量注入的长随机密钥
    secret: "change-me-in-production-0123456789-abcdef-0123456789"
    ttl-hours: 24
  engine:
    # Python 解释器路径
    python-path: python

logging:
  level:
    com.example.apitest: INFO
